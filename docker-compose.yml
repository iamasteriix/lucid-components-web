services:
  base:
    image: skyline
    build:
      context: .
      target: development

  uikit-web:
    image: skyline
    command: npm run dev --workspace=packages/web -- --host 0.0.0.0
    volumes:
      - .:/app
      - uikit_web_root_modules:/app/node_modules/
      - uikit_web_workspace_modules:/app/packages/web/node_modules/
    ports:
      - "3001:3001"

  uikit-native:
    image: skyline
    volumes:
      - .:/app
      - uikit_native_root_modules:/app/node_modules/
      - uikit_native_workspace_modules:/app/packages/native/node_modules/
    ports:
      - "4001:4001"

  uikit-icons:
    image: skyline
    volumes:
      - .:/app
      - uikit_icons_root_modules:/app/node_modules/
      - uikit_icons_workspace_modules:/app/packages/icons/node_modules/

volumes:
  uikit_web_root_modules:
  uikit_web_workspace_modules:
  uikit_native_root_modules:
  uikit_native_workspace_modules:
  uikit_icons_root_modules:
  uikit_icons_workspace_modules:
